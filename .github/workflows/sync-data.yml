name: Sync player data

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest CSVs from scraper repo
        run: |
          mkdir -p data/processed
          for file in players_26_27.csv matches_26_27.csv match_stats_26_27.csv; do
            curl -sL "https://raw.githubusercontent.com/Sharone-12/sofascore-scraper/main/data/processed/$file" -o "data/processed/$file"
          done
          wc -l data/processed/*.csv

      - name: Install server dependencies
        run: cd server && npm install

      - name: Seed MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: cd server && node seeds/seed.js
